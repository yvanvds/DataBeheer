<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>

  <!-- ================= linkerpaneel: de vier uiteinden ================= -->
  <text x="40" y="44" font-weight="bold" fill="#111111">De uiteinden van een relatielijn</text>

  <!-- precies een -->
  <line x1="40" y1="90" x2="200" y2="90" stroke="#333333" stroke-width="1.5"/>
  <line x1="168" y1="81" x2="168" y2="99" stroke="#333333" stroke-width="1.5"/>
  <line x1="180" y1="81" x2="180" y2="99" stroke="#333333" stroke-width="1.5"/>
  <text x="225" y="95" fill="#111111">precies één</text>

  <!-- nul of een -->
  <line x1="40" y1="150" x2="200" y2="150" stroke="#333333" stroke-width="1.5"/>
  <circle cx="162" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <line x1="180" y1="141" x2="180" y2="159" stroke="#333333" stroke-width="1.5"/>
  <text x="225" y="155" fill="#111111">nul of één</text>

  <!-- een of veel -->
  <line x1="40" y1="210" x2="200" y2="210" stroke="#333333" stroke-width="1.5"/>
  <line x1="160" y1="201" x2="160" y2="219" stroke="#333333" stroke-width="1.5"/>
  <line x1="172" y1="210" x2="200" y2="201" stroke="#333333" stroke-width="1.5"/>
  <line x1="172" y1="210" x2="200" y2="219" stroke="#333333" stroke-width="1.5"/>
  <text x="225" y="215" fill="#111111">één of veel</text>

  <!-- nul of veel -->
  <line x1="40" y1="270" x2="200" y2="270" stroke="#333333" stroke-width="1.5"/>
  <circle cx="158" cy="270" r="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <line x1="172" y1="270" x2="200" y2="261" stroke="#333333" stroke-width="1.5"/>
  <line x1="172" y1="270" x2="200" y2="279" stroke="#333333" stroke-width="1.5"/>
  <text x="225" y="275" fill="#111111">nul of veel</text>

  <text x="40" y="330" fill="#666666" font-size="12">de kraaienpoot (crow's foot) = de veel-kant</text>

  <!-- ================= rechterpaneel: voorbeeld ================= -->
  <text x="500" y="44" font-weight="bold" fill="#111111">Voorbeeld: klassen en leerlingen</text>

  <!-- klassen -->
  <g>
    <rect x="500" y="70" width="160" height="78" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <rect x="500" y="70" width="160" height="28" fill="#e8e8e8" stroke="#333333" stroke-width="1.5"/>
    <text x="580" y="89" text-anchor="middle" font-weight="bold" fill="#111111">klassen</text>
    <text x="512" y="118" fill="#111111">klas_id</text><text x="648" y="118" text-anchor="end" fill="#666666">PK</text>
    <text x="512" y="140" fill="#111111">naam</text>
  </g>

  <!-- leerlingen -->
  <g>
    <rect x="770" y="70" width="170" height="100" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <rect x="770" y="70" width="170" height="28" fill="#e8e8e8" stroke="#333333" stroke-width="1.5"/>
    <text x="855" y="89" text-anchor="middle" font-weight="bold" fill="#111111">leerlingen</text>
    <text x="782" y="118" fill="#111111">leerling_id</text><text x="928" y="118" text-anchor="end" fill="#666666">PK</text>
    <text x="782" y="140" fill="#111111">naam</text>
    <text x="782" y="162" fill="#111111">klas_id</text><text x="928" y="162" text-anchor="end" fill="#666666">FK</text>
  </g>

  <!-- relatie: klassen (precies een) - leerlingen (een of veel) -->
  <line x1="660" y1="110" x2="770" y2="110" stroke="#333333" stroke-width="1.5"/>
  <line x1="672" y1="101" x2="672" y2="119" stroke="#333333" stroke-width="1.5"/>
  <line x1="684" y1="101" x2="684" y2="119" stroke="#333333" stroke-width="1.5"/>
  <line x1="744" y1="101" x2="744" y2="119" stroke="#333333" stroke-width="1.5"/>
  <line x1="754" y1="110" x2="770" y2="101" stroke="#333333" stroke-width="1.5"/>
  <line x1="754" y1="110" x2="770" y2="119" stroke="#333333" stroke-width="1.5"/>

  <text x="500" y="230" fill="#111111">Lees in twee richtingen:</text>
  <text x="500" y="258" fill="#111111">• één klas telt één of meer leerlingen</text>
  <text x="500" y="284" fill="#111111">• elke leerling zit in precies één klas</text>
  <text x="500" y="330" fill="#666666" font-size="12">de kraaienpoot staat aan de veel-kant —</text>
  <text x="500" y="348" fill="#666666" font-size="12">daar staat ook de vreemde sleutel (klas_id)</text>
</svg>
