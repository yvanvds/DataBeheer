<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- ================= klanten ================= -->
  <g>
    <rect x="30" y="40" width="215" height="206" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <rect x="30" y="40" width="215" height="28" fill="#e8e8e8" stroke="#333333" stroke-width="1.5"/>
    <text x="137" y="59" text-anchor="middle" font-weight="bold" fill="#111111">klanten</text>
    <text x="42" y="88"  fill="#111111">klant_id</text><text x="233" y="88"  text-anchor="end" fill="#666666">PK</text>
    <text x="42" y="110" fill="#111111">bedrijfsnaam</text>
    <text x="42" y="132" fill="#111111">contactpersoon</text>
    <text x="42" y="154" fill="#111111">email</text>
    <text x="42" y="176" fill="#111111">gemeente</text>
    <text x="42" y="198" fill="#111111">postcode</text>
    <text x="42" y="220" fill="#111111">btw_nummer</text>
    <text x="42" y="242" fill="#111111">klant_sinds</text>
  </g>

  <!-- ================= facturen ================= -->
  <g>
    <rect x="330" y="40" width="200" height="140" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <rect x="330" y="40" width="200" height="28" fill="#e8e8e8" stroke="#333333" stroke-width="1.5"/>
    <text x="430" y="59" text-anchor="middle" font-weight="bold" fill="#111111">facturen</text>
    <text x="342" y="88"  fill="#111111">factuur_id</text><text x="518" y="88"  text-anchor="end" fill="#666666">PK</text>
    <text x="342" y="110" fill="#111111">klant_id</text><text x="518" y="110" text-anchor="end" fill="#666666">FK</text>
    <text x="342" y="132" fill="#111111">factuurdatum</text>
    <text x="342" y="154" fill="#111111">vervaldatum</text>
    <text x="342" y="176" fill="#111111">betaald_op</text>
  </g>

  <!-- ================= factuurlijnen ================= -->
  <g>
    <rect x="640" y="40" width="200" height="140" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <rect x="640" y="40" width="200" height="28" fill="#e8e8e8" stroke="#333333" stroke-width="1.5"/>
    <text x="740" y="59" text-anchor="middle" font-weight="bold" fill="#111111">factuurlijnen</text>
    <text x="652" y="88"  fill="#111111">lijn_id</text><text x="828" y="88"  text-anchor="end" fill="#666666">PK</text>
    <text x="652" y="110" fill="#111111">factuur_id</text><text x="828" y="110" text-anchor="end" fill="#666666">FK</text>
    <text x="652" y="132" fill="#111111">product_id</text><text x="828" y="132" text-anchor="end" fill="#666666">FK</text>
    <text x="652" y="154" fill="#111111">aantal</text>
    <text x="652" y="176" fill="#111111">eenheidsprijs</text>
  </g>

  <!-- ================= producten ================= -->
  <g>
    <rect x="640" y="290" width="200" height="140" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <rect x="640" y="290" width="200" height="28" fill="#e8e8e8" stroke="#333333" stroke-width="1.5"/>
    <text x="740" y="309" text-anchor="middle" font-weight="bold" fill="#111111">producten</text>
    <text x="652" y="338" fill="#111111">product_id</text><text x="828" y="338" text-anchor="end" fill="#666666">PK</text>
    <text x="652" y="360" fill="#111111">naam</text>
    <text x="652" y="382" fill="#111111">categorie</text>
    <text x="652" y="404" fill="#111111">eenheidsprijs</text>
    <text x="652" y="426" fill="#111111">btw_code</text><text x="828" y="426" text-anchor="end" fill="#666666">FK</text>
  </g>

  <!-- ================= btw_tarieven ================= -->
  <g>
    <rect x="330" y="312" width="200" height="96" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <rect x="330" y="312" width="200" height="28" fill="#e8e8e8" stroke="#333333" stroke-width="1.5"/>
    <text x="430" y="331" text-anchor="middle" font-weight="bold" fill="#111111">btw_tarieven</text>
    <text x="342" y="360" fill="#111111">btw_code</text><text x="518" y="360" text-anchor="end" fill="#666666">PK</text>
    <text x="342" y="382" fill="#111111">omschrijving</text>
    <text x="342" y="404" fill="#111111">tarief</text>
  </g>

  <!-- ============ relaties ============ -->
  <!-- klanten 1-n facturen -->
  <line x1="245" y1="105" x2="330" y2="105" stroke="#333333" stroke-width="1.5"/>
  <text x="253" y="99" fill="#666666" font-size="12">1</text>
  <text x="316" y="99" fill="#666666" font-size="12">n</text>

  <!-- facturen 1-n factuurlijnen -->
  <line x1="530" y1="105" x2="640" y2="105" stroke="#333333" stroke-width="1.5"/>
  <text x="538" y="99" fill="#666666" font-size="12">1</text>
  <text x="626" y="99" fill="#666666" font-size="12">n</text>

  <!-- producten 1-n factuurlijnen -->
  <line x1="740" y1="290" x2="740" y2="180" stroke="#333333" stroke-width="1.5"/>
  <text x="748" y="283" fill="#666666" font-size="12">1</text>
  <text x="748" y="194" fill="#666666" font-size="12">n</text>

  <!-- btw_tarieven 1-n producten -->
  <line x1="530" y1="380" x2="640" y2="380" stroke="#333333" stroke-width="1.5"/>
  <text x="538" y="374" fill="#666666" font-size="12">1</text>
  <text x="626" y="374" fill="#666666" font-size="12">n</text>
</svg>
